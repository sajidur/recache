services:
  recache:
    image: sajidur07/recache:latest
    # Uncomment to build from source instead of pulling the image:
    # build: .
    container_name: recache
    ports:
      - "6380:6380"
    environment:
      # Config binds via the standard ASP.NET Core convention:
      # Recache__<Property> maps to the "Recache" section's property.
      Recache__RequireAuth: "true"
      Recache__Password: "changeme" # change this before real use

      # Persist every write to /data/appendonly.aof (replayed on
      # restart). "everysec" fsyncs once a second; "always" fsyncs
      # before every reply.
      Recache__EnableAof: "true"
      Recache__AofFsync: "everysec"
    volumes:
      # The AOF (and, in cluster mode, nodes.conf) — keep it across
      # container recreation.
      - recache-data:/data
      - recache-logs:/app/logs

      # To use a real config file instead of environment variables,
      # comment out the environment block above and mount one:
      # - ./appsettings.yaml:/app/appsettings.yaml:ro
    restart: unless-stopped

volumes:
  recache-data:
  recache-logs:
