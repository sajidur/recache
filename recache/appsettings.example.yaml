# Copy this file to appsettings.yaml and set a real password before
# running recache. appsettings.yaml is gitignored on purpose so a
# real credential never ends up committed.
Recache:
  Host: "0.0.0.0"
  Port: 6380
  MaxConnections: 10000
  MaxRequestBytes: 16777216
  MaxValueBytes: 8388608
  MaxMemoryBytes: 4294967296
  RequireAuth: true
  Password: "CHANGE_THIS"
  EnableAof: true
  AofPath: "/data/appendonly.aof"
  DatabaseCount: 16
  EnableFileLogging: true
  LogDirectory: "logs"
  LogRetentionDays: 7

  # Hash-slot cluster mode: CLUSTER commands, MOVED/ASK redirection,
  # CROSSSLOT/CLUSTERDOWN enforcement. Off by default. See the
  # "Cluster mode" section in README.md for a bring-up walkthrough.
  ClusterEnabled: false
  ClusterConfigFile: "nodes.conf"
  # ClusterAnnounceIp: "192.168.1.10"   # defaults to Host if unset
  # ClusterAnnouncePort: 6380           # defaults to Port if unset
